# Apply Metadata — standalone job for re-running descriptions on demand.
# Idempotent. Run any time you change tables / columns / tags.
#
#   databricks bundle run apply_metadata

resources:
  jobs:
    apply_metadata:
      name: "Apply Metadata (table + column comments + tags)"
      parameters:
        - name: catalog_name
          default: ${var.catalog_name}
        - name: bronze_schema
          default: ${var.bronze_schema}
        - name: silver_schema
          default: ${var.silver_schema}
        - name: gold_schema
          default: ${var.gold_schema}

      tasks:
        - task_key: apply_metadata
          notebook_task:
            notebook_path: ../src/00_setup/apply_metadata.py
            base_parameters:
              catalog_name: ${var.catalog_name}
              bronze_schema: ${var.bronze_schema}
              silver_schema: ${var.silver_schema}
              gold_schema: ${var.gold_schema}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "5"
